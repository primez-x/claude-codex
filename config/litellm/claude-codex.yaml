# LiteLLM model aliases for Claude Code through the Anthropic-compatible
# gateway. Keep credentials in environment variables or provider auth stores.

model_list:
  - model_name: opusplan
    litellm_params:
      model: chatgpt/gpt-5.5
      reasoning_effort: xhigh
    model_info:
      mode: responses
      max_input_tokens: 272000

  - model_name: opusplan-opus-4-8
